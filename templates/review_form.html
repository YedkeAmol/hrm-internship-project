{% extends "base.html" %}
{% block title %}{% if review %}Update Review{% else %}Add Review{% endif %}{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm">
            <div class="card-header bg-white">
                <h4 class="mb-0">{% if review %}Update Review{% else %}Add Review{% endif %}</h4>
            </div>
            <div class="card-body p-4">
                <form method="post">
                    
                    <div class="mb-3">
                        <label class="form-label">Review Title:</label>
                        <input type="text" class="form-control" name="review_title" value="{{ review.review_title if review else '' }}" required>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Select Employee:</label>
                        <select name="employee_id" class="form-select" required>
                            <option value="">Open this select menu</option>
                            {% for report in reports %}
                            <option value="{{ report.employee_id }}" {% if review and review.employee_id == report.employee_id %}selected{% endif %}>
                                {{ report.first_name }} {{ report.last_name }}
                            </option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Review Date:</label>
                        <input type="date" class="form-control" name="review_date" value="{{ review.review_date if review else '' }}" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Review Period:</label>
                        <select name="review_period" class="form-select" required>
                            <option value="">Select Period</option>
                            <option value="Monthly" {% if review and review.review_period == 'Monthly' %}selected{% endif %}>Monthly</option>
                            <option value="Quarterly" {% if review and review.review_period == 'Quarterly' %}selected{% endif %}>Quarterly</option>
                            <option value="Annual" {% if review and review.review_period == 'Annual' %}selected{% endif %}>Annual</option>
                        </select>
                        <small class="text-muted">Monthly, Quarterly and Annual</small>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Enter Rating (1-10):</label>
                        <input type="number" class="form-control" name="rating" min="1" max="10" value="{{ review.rating if review else '' }}" required>
                    </div>

                    <div class="mb-4">
                        <label class="form-label">Review Comment:</label>
                        <textarea class="form-control" name="comments" rows="3">{{ review.comments if review else '' }}</textarea>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">
                            {% if review %}Update Review{% else %}Add Review{% endif %}
                        </button>
                        <a href="{{ url_for('reviews') }}" class="btn btn-outline-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
