{% extends "base.html" %}
{% block title %}Add Leave Quota{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm">
            <div class="card-header bg-white">
                <h4 class="mb-0">Leave Quota</h4>
            </div>
            <div class="card-body p-4">
                <form method="post">
                    
                    <div class="mb-3">
                        <label class="form-label">Select employee</label>
                        <select name="employee_id" class="form-select" required>
                            <option value="">Select Employee</option>
                            {% for u in users %}
                            <option value="{{ u.employee_id }}" {% if request.args.get('employee_id')|string == u.employee_id|string %}selected{% endif %}>
                                {{ u.first_name }} {{ u.last_name }}
                            </option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">PL Quota</label>
                        <input type="number" class="form-control" name="pl_quota" min="0" value="0" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">CL Quota</label>
                        <input type="number" class="form-control" name="cl_quota" min="0" value="0" required>
                    </div>

                    <div class="mb-4">
                        <label class="form-label">SL Quota</label>
                        <input type="number" class="form-control" name="sl_quota" min="0" value="0" required>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">Save</button>
                        <a href="{{ url_for('leave_quotas') }}" class="btn btn-outline-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
