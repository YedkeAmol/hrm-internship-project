{% extends "base.html" %}
{% block title %}Reset Password{% endblock %}
{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 80vh;">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow p-4 border-info">
            <form method="post">
                <div class="mb-3 row align-items-center">
                    <label class="col-sm-4 col-form-label small">New Password:</label>
                    <div class="col-sm-8">
                        <input type="password" class="form-control" name="new_password" required>
                    </div>
                </div>
                <div class="mb-4 row align-items-center">
                    <label class="col-sm-4 col-form-label small">Confirm New Password:</label>
                    <div class="col-sm-8">
                        <input type="password" class="form-control" name="confirm_password" required>
                    </div>
                </div>
                <div class="text-center">
                    <button type="submit" class="btn btn-primary px-4">Reset Password</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
