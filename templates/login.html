{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 80vh;">
    <div class="col-md-5 col-lg-4">
        <div class="card shadow p-4 text-center">
            <h3 class="mb-4 text-info">Login to your account</h3>
            <form method="post">
                <div class="mb-3 text-start">
                    <input type="text" class="form-control" name="username" placeholder="Username" required>
                </div>
                <div class="mb-4 text-start">
                    <input type="password" class="form-control" name="password" placeholder="Password" required>
                </div>
                <button type="submit" class="btn btn-info w-100 text-white mb-3">Login</button>
            </form>
            <a href="{{ url_for('forgot_password') }}" class="text-muted text-decoration-none small">Forgot your password?</a>
        </div>
    </div>
</div>
{% endblock %}
