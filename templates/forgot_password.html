{% extends "base.html" %}
{% block title %}Forgot Password{% endblock %}
{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 80vh;">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow p-4 border-info">
            <h5 class="mb-4">Username or Email Address</h5>
            <form method="post">
                <div class="mb-4">
                    <input type="email" class="form-control" name="email" placeholder="Registered email address" required>
                </div>
                <button type="submit" class="btn btn-info text-white w-100">Get New Password</button>
            </form>
            <div class="mt-3 text-center">
                <a href="{{ url_for('login') }}" class="text-muted text-decoration-none small">Back to Login</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
